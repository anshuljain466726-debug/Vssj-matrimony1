        font-weight="700" fill="#C2185B" text-anchor="middle">SSJ</text>

  <!-- left flourish -->
  <path d="M14 60 Q22 54 30 60 Q22 66 14 60 Z" fill="url(#goldGrad)"/>
  <!-- right flourish -->
  <path d="M106 60 Q98 54 90 60 Q98 66 106 60 Z" fill="url(#goldGrad)"/>

