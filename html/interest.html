<style>

.interest-tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.interest-tab-btn{
    padding:9px 22px;
    border:1px solid var(--border,#e5e5e5);
    background:#fff;
    border-radius:30px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    color:var(--dark,#333);
    transition:.3s;
}

.interest-tab-btn.active{
    background:var(--gradient,linear-gradient(135deg,#C2185B,#3D2645));
    color:#fff;
    border-color:transparent;
}

.interest-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:18px;
}

.interest-card{
    background:#fff;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
    overflow:hidden;
    text-align:center;
    padding-bottom:14px;
}

.interest-card img{
    width:100%;
    height:190px;
    object-fit:cover;
    background:#f1f1f1;
}

.interest-card h3{
    font-size:15px;
    margin:10px 0 2px;
}

.interest-card p{
    font-size:12px;
    color:#777;
    margin-bottom:8px;
}

.interest-status{
    display:inline-block;
    padding:3px 12px;
    border-radius:20px;
    font-size:11px;
    font-weight:600;
    margin-bottom:8px;
}

.interest-status.Pending{ background:#fff3cd; color:#856404; }
.interest-status.Accepted{ background:#d4edda; color:#155724; }
.interest-status.Rejected{ background:#f8d7da; color:#721c24; }

.interest-actions{
    display:flex;
    gap:8px;
    justify-content:center;
}

.interest-actions button{
    padding:7px 16px;
    border:none;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
}

.accept-btn{ background:#1f9d55; color:#fff; }
.reject-btn{ background:#e5484d; color:#fff; }

.interest-empty{
    text-align:center;
    color:#888;
    padding:40px 0;
    grid-column:1/-1;
}

</style>

<link href="../css/lightbox.css" rel="stylesheet"/>
<link href="../css/mobile-theme.css" rel="stylesheet"/>
</head>
